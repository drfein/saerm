storage:
  root_url: "/nlp/scr/drfein/saerm"
  embeddings_dir: "embeddings"
  sae_dir: "sae"
  heads_dir: "heads"

datasets:
  skywork_train:
    name: "Skywork/Skywork-Reward-Preference-80K-v0.2"
    split: "train"
    field_mapping:
      prompt: "prompt"
      chosen: "chosen"
      rejected: "rejected"
  reward_bench_eval:
    name: "allenai/reward-bench-2"
    split: "test"
    field_mapping:
      prompt: "prompt"
      response_a: "chosen"
      response_b: "rejected"
      label: "label"

embedding_jobs:
  - job_id: "skywork-rm"
    model: "Skywork/Skywork-Reward-V2-Qwen3-0.6B"
    layer: "last"
    dataset: "skywork_train"
    batch_size: 64
    max_examples: null
    chat_messages_field: "chosen"
    paired_chat_messages_field: "rejected"
    chat_add_generation_prompt: false

sae_jobs:
  - job_id: "skywork-sae"
    embedding_job: "skywork-rm"
    hidden_size: 512
    k_active: 4
    l1_coef: 0.002
    learning_rate: 0.00001
    epochs: 20
    batch_size: 128
    device: "auto"
    checkpoint_interval: 500

head_jobs:
  - job_id: "skywork-linear"
    embedding_job: "skywork-rm"
    sae_job: "skywork-sae"
    dataset: "skywork_train"
    head_type: "linear_bt"
    params:
      lr: 0.01
      max_epochs: 500
      weight_chosen: 1.0
      weight_rejected: 1.0
    train_split: "train"
    eval_split: null
