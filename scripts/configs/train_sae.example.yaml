btrm:
  repo: "danielfein/bt-rewmodel-Qwen_Qwen2.5-1.5B-final-20250510_202305"  # or local path
  hf_token: "${HF_TOKEN}"  # can be empty to use env HF_TOKEN
  device: "cuda"  # or "cpu"
  max_length: 2048

sae:
  num_neurons: 4096
  k_active: 256
  training:
    batch_size: 32
    learning_rate: 0.0005
    n_epochs: 10
    patience: 3
    show_progress: true

outputs:
  dir: "outputs/sae_btrm_lastlayer"
  metrics_cap: 2048

wandb:
  enabled: true
  project: "saerm"
  run_name: "sae-train"

features:
  dir: "outputs/sae_btrm_lastlayer/features"
  shard_size: 20000
  dtype: "float16"  # options: float16, float32, bf16
  extract_only: false
  train_from_features: true
  resume_before_train: true

