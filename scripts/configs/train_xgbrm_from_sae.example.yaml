btrm:
  repo: "danielfein/bt-rewmodel-Qwen_Qwen2.5-1.5B-final-20250510_202305"
  hf_token: "${HF_TOKEN}"
  device: "cuda"
  max_length: 2048

sae:
  dir: "outputs/sae_btrm_lastlayer/sae"
  # Optional: if provided, train XGB head from precomputed features/codes
  features_dir: "outputs/sae_btrm_lastlayer/features"

rm:
  encode_batch_size: 32
  show_progress: true
  eval_batch_size: 64
  xgb_params:
    objective: "rank:pairwise"
    learning_rate: 0.05
    max_depth: 8
    subsample: 0.8
    colsample_bytree: 0.8
    n_estimators: 500
    tree_method: "hist"

outputs:
  dir: "outputs/xgbrm_from_sae"


